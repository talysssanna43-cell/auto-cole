[build]
  command = ""
  publish = "."

[functions]
  directory = "netlify/functions"

[functions."process-installments"]
  schedule = "15 5 * * *"

[functions."process-payment-emails"]
  schedule = "*/15 * * * *"

[functions."process-decision-emails"]
  schedule = "7,22,37,52 * * * *"

[functions."process-exam-result-requests"]
  schedule = "17 9 * * *"

[functions."process-driving-prep-reminders"]
  schedule = "*/15 * * * *"

[dev]
  port = 8888
  publish = "."
  autoLaunch = false

# Technical source files must never be served by the public site.
[[redirects]]
  from = "/api/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/sql/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/tests/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/*.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
