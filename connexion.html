<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto-Ecole Breteuil - Connexion</title>
    <meta name="description" content="Connecte-toi à ton espace élève Auto-Ecole Breteuil pour réserver tes heures de conduite et suivre ta progression.">
    <script>
        if (window.location.protocol === 'file:') {
            const params = new URLSearchParams(window.location.search);
            const requested = params.get('redirect');
            const safeRedirect = requested && !/^file:/i.test(requested) ? requested : 'admin-planning.html';
            window.location.replace(`http://localhost:8892/connexion.html?redirect=${encodeURIComponent(safeRedirect)}`);
        }
    </script>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, rgba(255,105,180,0.15), rgba(233,30,99,0.15));
            margin: 0;
            padding: 0;
        }
        .login-page {
            min-height: calc(100vh - 132px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .login-card {
            background: white;
            border-radius: 30px;
            padding: 3rem;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 30px 80px rgba(233,30,99,0.2);
            position: relative;
            overflow: hidden;
        }
        .login-card::after {
            content: '';
            position: absolute;
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: var(--primary-gradient);
            opacity: 0.08;
            top: -80px;
            right: -80px;
        }
        .login-header {
            text-align: center;
            margin-bottom: 2rem;
            position: relative;
            z-index: 1;
        }
        .login-header h1 {
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
        }
        .login-header p {
            color: var(--text-light);
        }
        .login-form {
            position: relative;
            z-index: 1;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }
        .form-group input {
            width: 100%;
            padding: 0.9rem 1rem;
            border-radius: var(--radius-lg);
            border: 1px solid rgba(0,0,0,0.1);
            font-size: 1rem;
            transition: border var(--transition-base), box-shadow var(--transition-base);
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(255,105,180,0.15);
        }
        .login-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }
        .login-actions a {
            color: var(--primary-dark);
            font-size: 0.95rem;
            text-decoration: none;
        }
        .login-footer {
            text-align: center;
            margin-top: 2rem;
            color: var(--text-light);
        }
        .login-footer a {
            color: var(--primary-dark);
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <nav class="navbar" id="navbar">
        <div class="container"><div class="nav-wrapper">
            <a href="index.html" class="logo"><img src="assets/logo.png" alt="Auto-Ecole Breteuil"><span>Auto-Ecole <strong>Breteuil</strong></span></a>
            <button class="mobile-menu-toggle" id="mobileMenuToggle" aria-label="Ouvrir le menu"><span></span><span></span><span></span></button>
            <ul class="nav-menu" id="navMenu"><li><a href="index.html">Accueil</a></li><li><a href="recrutement.html">Recrutement</a></li><li><a href="qui-sommes-nous.html">Qui sommes-nous</a></li><li><a href="tarifs.html">Tarifs</a></li><li><a href="contact.html">Contact</a></li></ul>
            <div class="nav-actions"><a href="connexion.html" class="btn-secondary">Se connecter</a><a href="inscription.html" class="btn-primary">S'inscrire</a></div>
        </div></div>
    </nav>
    <main class="login-page">
    <div class="login-card">
        <a href="index.html" style="display:inline-flex;align-items:center;gap:6px;color:#666;text-decoration:none;font-size:0.9rem;margin-bottom:1rem;">
            <i class="fas fa-arrow-left"></i> Retour à l'accueil
        </a>
        <div class="login-header">
            <h1>Connexion</h1>
            <p>Accède à ton espace pour réserver tes heures et suivre ta progression.</p>
        </div>
        <form class="login-form" id="loginForm">
            <div class="form-group">
                <label for="email">Adresse e-mail</label>
                <input type="email" id="email" placeholder="nail30@hotmail.fr" required>
            </div>
            <div class="form-group">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <div class="login-actions">
                <label style="display: flex; gap: 0.35rem; align-items: center; font-size: 0.95rem;">
                    <input type="checkbox" id="remember" style="accent-color: #FF69B4;"> Rester connecté(e)
                </label>
                <a href="reset-password.html">Mot de passe oublié ?</a>
            </div>
            <button type="submit" class="btn-primary btn-block" style="font-size: 1.05rem;">Se connecter</button>
            <p id="loginMessage" role="alert" aria-live="polite" style="display: none; margin: 0.85rem 0 0; color: #c82362; font-weight: 600;"></p>
            <div class="login-footer">
                Pas encore de compte ? <a href="inscription.html">Créer un espace élève</a>
            </div>
        </form>
    </div>
    </main>
    <script src="https://unpkg.com/@supabase/supabase-js@2.43.4/dist/umd/supabase.js"></script>
    <script src="assets/js/supabaseClient.js?v=8"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const loginForm = document.getElementById('loginForm');
            const loginMessage = document.getElementById('loginMessage');
            const submitButton = loginForm?.querySelector('button[type="submit"]');
            let loginInProgress = false;

            if (!loginForm || !submitButton || !loginMessage) return;

            const messages = {
                INVALID_CREDENTIALS: 'Adresse e-mail ou mot de passe incorrect.',
                INSCRIPTION_PENDING: 'Ton inscription est en cours de traitement. Tu pourras te connecter après sa validation.',
                INSCRIPTION_REJECTED: 'Ton inscription a été refusée. Consulte ton e-mail ou contacte l\'Auto-Ecole Breteuil.',
                SUPABASE_SERVER_NOT_CONFIGURED: 'La connexion au serveur est temporairement indisponible.',
                SESSION_SECRET_NOT_CONFIGURED: 'La connexion sécurisée doit encore être configurée sur le serveur.'
            };

            function showLoginMessage(message) {
                loginMessage.textContent = message;
                loginMessage.style.display = 'block';
            }

            function safeRedirect(value, fallback, role) {
                if (!value) return fallback;
                try {
                    if (/^file:/i.test(value)) return fallback;
                    const destination = new URL(value, window.location.origin);
                    if (destination.protocol === 'file:') return fallback;
                    if (!['http:', 'https:'].includes(destination.protocol) && window.location.protocol !== 'file:') return fallback;
                    if (window.location.protocol === 'file:') return fallback;
                    if (destination.origin !== window.location.origin) return fallback;

                    const path = destination.pathname.toLowerCase();
                    const roleTargets = {
                        admin: ['admin-'],
                        instructor: ['espace-moniteur.html'],
                        student: ['espace-eleve.html', 'parrainage.html']
                    };
                    const allowed = roleTargets[role] || [];
                    const target = `${destination.pathname}${destination.search}${destination.hash}`;
                    return allowed.some((pattern) => path.includes(pattern)) ? target : fallback;
                } catch (error) {
                    return fallback;
                }
            }

            loginForm.addEventListener('submit', async (event) => {
                event.preventDefault();
                if (loginInProgress) return;

                loginInProgress = true;
                submitButton.disabled = true;
                submitButton.textContent = 'Connexion...';
                loginMessage.style.display = 'none';

                try {
                    if (!window.authSession) throw new Error('AUTH_NOT_LOADED');
                    const email = document.getElementById('email').value.trim().toLowerCase();
                    const password = document.getElementById('password').value;
                    const remember = document.getElementById('remember')?.checked === true;
                    const user = await window.authSession.login(email, password, remember);

                    const defaults = {
                        admin: 'admin-planning.html',
                        instructor: 'espace-moniteur.html',
                        student: 'espace-eleve.html'
                    };
                    const fallback = defaults[user.role] || 'index.html';
                    const requested = new URLSearchParams(window.location.search).get('redirect');
                    window.location.replace(safeRedirect(requested, fallback, user.role));
                } catch (error) {
                    const isStaticLocalhost = ['localhost', '127.0.0.1'].includes(window.location.hostname)
                        && error.status === 404;
                    showLoginMessage(isStaticLocalhost
                        ? 'Ce serveur local ne lance pas les fonctions sécurisées. Ouvre le site avec Netlify Dev.'
                        : (messages[error.message] || 'Connexion impossible pour le moment. Réessaie dans un instant.'));
                } finally {
                    loginInProgress = false;
                    submitButton.disabled = false;
                    submitButton.textContent = 'Se connecter';
                }
            });
        });
    </script>
    <script src="assets/js/site-footer.js?v=9"></script>
    <script src="assets/js/text-encoding-fix.js?v=2"></script>
</body>
</html>
